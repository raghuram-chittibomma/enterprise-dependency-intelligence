[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "evals"]
markers = [
    "integration: requires a live external service (e.g. Neo4j) -- skips itself if unreachable",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends(...)`/`Query(...)` default-argument pattern is
# idiomatic, not the mutable-default-argument bug this rule targets.
ignore = ["B008"]
