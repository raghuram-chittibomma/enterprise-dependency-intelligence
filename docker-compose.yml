services:
  neo4j:
    image: neo4j:5.24-community
    container_name: edi-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # Neo4j Browser (HTTP)
      - "7687:7687" # Bolt
    environment:
      # Local-only dev credential over a synthetic dataset (ADR-0001) -- not a
      # secret, but overridable: set NEO4J_PASSWORD in the shell/.env before
      # `docker-compose up` to change it.
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-edi-local-dev}"
    volumes:
      - edi-neo4j-data:/data
      - edi-neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  edi-neo4j-data:
  edi-neo4j-logs:
